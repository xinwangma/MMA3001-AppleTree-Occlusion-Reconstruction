[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mma3001-apple-tree-occlusion"
version = "0.1.0"
description = "Occlusion-aware Y-shaped apple tree skeleton reconstruction - MMA3001 coursework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
study = ["matplotlib>=3.7,<4"]
dev = ["pytest>=7,<10", "matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
